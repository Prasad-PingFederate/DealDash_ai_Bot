name: Daily tests

on:
  schedule:
    # 13:00 UTC is 18:30 IST. One run a day, separate from the deal poster.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -q --tb=short | tee pytest-out.txt

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest-out.txt
          if-no-files-found: ignore
