name: Autonomous Growth & Strategy Advisor (Hermes)

on:
  schedule:
    # Sunday 03:11 UTC (08:41 IST). GitHub often starts this hours late;
    # an earlier slot still lands on Sunday daytime instead of the afternoon.
    - cron: '11 3 * * 0'
  workflow_dispatch:
    inputs:
      sale_mode:
        description: 'Active Sale Mode (diwali, great_indian_festival, prime_day, flash, or none)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-growth-advisor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Growth Advisor (Hermes / Gemini)
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'nousresearch/hermes-3-llama-3.1-8b' }}
          SALE_MODE: ${{ inputs.sale_mode || '' }}
        run: |
          python -m dealbot.growth_advisor

      - name: Publish Summary to GitHub Actions
        run: |
          if [ -f reports/GROWTH_DIGEST.md ]; then
            cat reports/GROWTH_DIGEST.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and persist GROWTH_DIGEST.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/GROWTH_DIGEST.md || true
          git diff --staged --quiet || (git commit -m "chore(advisor): update autonomous growth digest [skip ci]" && git push)
