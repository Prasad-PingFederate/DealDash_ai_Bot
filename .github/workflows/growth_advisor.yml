name: Autonomous Growth & Strategy Advisor (Hermes)

on:
  schedule:
    # Sunday 03:11 UTC (08:41 IST). Started early because GitHub often runs
    # this hours late; a delay still lands on Sunday daytime.
    - cron: '11 3 * * 0'
  workflow_dispatch:
    inputs:
      sale_mode:
        description: 'Active Sale Mode (diwali, great_indian_festival, prime_day, flash, or none)'
        required: false
        default: ''
        type: string

# Same lock as the deal bot so the two workflows cannot push main together.
concurrency:
  group: dealdash-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-growth-advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Growth Advisor (Hermes / Gemini)
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY || secrets.DEALS_AGENT_OPENROUTER }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'google/gemma-4-26b-a4b-it:free' }}
          HERMES_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          AI_TIMEOUT_SECONDS: '12'
          # Manual input wins. The weekly schedule uses the SALE_MODE secret.
          SALE_MODE: ${{ inputs.sale_mode || secrets.SALE_MODE || '' }}
        run: python -m dealbot.growth_advisor

      - name: Publish Summary to GitHub Actions
        run: |
          if [ -f reports/GROWTH_DIGEST.md ]; then
            cat reports/GROWTH_DIGEST.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and persist GROWTH_DIGEST.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp reports/GROWTH_DIGEST.md "$RUNNER_TEMP/GROWTH_DIGEST.md"
          persist() {
            git fetch origin main
            git checkout -f -B main origin/main
            mkdir -p reports
            cp "$RUNNER_TEMP/GROWTH_DIGEST.md" reports/GROWTH_DIGEST.md
            git add reports/GROWTH_DIGEST.md
            if git diff --staged --quiet; then
              echo "Digest unchanged."
              return 0
            fi
            git commit -m "chore(advisor): update autonomous growth digest [skip ci]"
            git push origin HEAD:main
          }
          persist || persist
