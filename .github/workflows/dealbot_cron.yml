name: Autonomous DealBot Runner

on:
  schedule:
    # Peak Hours: Every 30 minutes
    # - Lunch Peak: 12:30 PM - 2:30 PM IST (07:00 - 08:30 UTC)
    # - Evening Prime Peak: 07:30 PM - 10:30 PM IST (14:00 - 17:00 UTC)
    - cron: '*/30 7-8,14-17 * * *'

    # Normal Hours: Every 1 hour
    # - Morning: 08:30 AM - 11:30 AM IST (03:00 - 06:00 UTC)
    # - Afternoon: 03:30 PM - 06:30 PM IST (10:00 - 13:00 UTC)
    - cron: '0 3-6,10-13 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DealBot Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
        run: |
          python run_once.py

      - name: Commit and persist state.sqlite3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/state.sqlite3 || true
          git diff --staged --quiet || (git commit -m "chore(bot): persist posted deal state [skip ci]" && git push)
