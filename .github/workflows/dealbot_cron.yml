name: Autonomous DealBot Runner

on:
  schedule:
    # Anti-Congestion Optimization:
    # Scheduled at :15 and :45 past the hour to completely bypass GitHub Actions peak queue delays
    # (standard :00 and :30 jobs suffer 15-45 min delays on shared public runners).
    #
    # Note: GitHub Actions runs strictly in UTC (UTC +5:30 = IST).
    #
    # 1. Peak Hours (Every 30 minutes, 12 runs/day):
    # - Lunch Peak:   12:45 PM - 02:15 PM IST (07:15, 07:45, 08:15, 08:45 UTC)
    # - Evening Peak: 07:45 PM - 11:15 PM IST (14:15, 14:45, 15:15, 15:45, 16:15, 16:45, 17:15, 17:45 UTC)
    - cron: '15,45 7-8,14-17 * * *'

    # 2. Normal Hours (Every 1 hour, 8 runs/day):
    # - Morning:   08:45 AM - 11:45 AM IST (03:15, 04:15, 05:15, 06:15 UTC)
    # - Afternoon: 03:45 PM - 06:45 PM IST (10:15, 11:15, 12:15, 13:15 UTC)
    - cron: '15 3-6,10-13 * * *'

    # 3. Night Hours:
    # - Paused from 11:16 PM to 08:44 AM IST to save CI quota and avoid nighttime alerts.
    # Total daily runs: 20 runs/day (~1,000 mins/mo out of 2,000 free GitHub Actions minutes).

  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DealBot Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'nousresearch/hermes-3-llama-3.1-8b' }}
          SALE_MODE: ${{ secrets.SALE_MODE || '' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
        run: |
          python run_once.py

      - name: Commit and persist state.sqlite3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/state.sqlite3 || true
          git diff --staged --quiet || (git commit -m "chore(bot): persist posted deal state [skip ci]" && git push)
