name: Autonomous DealBot Runner

on:
  schedule:
    # UTC. Run every 2 hours between 03:37 UTC (09:07 IST) and 17:37 UTC (23:07 IST).
    # Minute 37 stays off the crowded :00 and :30 slots.
    - cron: '37 3,5,7,9,11,13,15,17 * * *'

  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'reports/**'
      - '**.md'

  workflow_dispatch:

# Dealbot and the weekly advisor both push main. One at a time, and do not
# cancel a run that has already posted to Telegram.
concurrency:
  group: dealdash-bot-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    # GitHub kills a job at 6 hours. The script stops itself just before that.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the hourly session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY || secrets.DEALS_AGENT_OPENROUTER }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'google/gemma-4-26b-a4b-it:free' }}
          HERMES_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
          AI_TIMEOUT_SECONDS: '12'
          SALE_MODE: ${{ secrets.SALE_MODE || '' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
          AGENT_MODE: 'true'
          AGENT_LLM: 'true'
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LISTEN_FOR_ENGAGEMENT: 'true'
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/actions_session.sh

      - name: Persist SQLite state on exit or cancellation
        if: always()
        run: |
          python -c "from dealbot.session import database_path; from dealbot.publisher import StateStore; StateStore(str(database_path())).checkpoint()" || true
          rm -f data/*.sqlite3-wal data/*.sqlite3-shm data/*.db-wal data/*.db-shm || true
          mkdir -p /tmp/dealbot_state_bak
          cp -f data/*.* /tmp/dealbot_state_bak/ 2>/dev/null || true
          bash -c '
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git fetch origin main || true
            git reset --hard origin/main || true
            cp -f /tmp/dealbot_state_bak/*.* data/ 2>/dev/null || true
            if [ -d data ]; then
              git add data/
              if ! git diff --staged --quiet; then
                git commit -m "chore(state): sync dealbot sqlite state [skip ci]" || true
                git push origin HEAD:main || true
              fi
            fi
          '
