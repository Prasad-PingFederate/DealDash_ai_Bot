name: Autonomous DealBot Runner

on:
  schedule:
    # Unified 30-minute interval across all active hours:
    # Runs continuously every 30 minutes from 08:45 AM to 11:15 PM IST (03:15 to 17:45 UTC)
    # Off-peak minutes (:15 and :45) avoid GitHub Actions queue congestion at :00 and :30.
    # Single unified expression eliminates GitHub's multi-array schedule bug and removes all evening gaps.
    # Automatically pauses from 11:16 PM to 08:44 AM IST (quiet mode, saves GitHub minutes).
    - cron: '15,45 3-17 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DealBot Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'nousresearch/hermes-3-llama-3.1-8b' }}
          SALE_MODE: ${{ secrets.SALE_MODE || '' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
        run: |
          python run_once.py

      - name: Commit and persist state.sqlite3
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/state.sqlite3 || true
          git diff --staged --quiet || (git commit -m "chore(bot): persist posted deal state [skip ci]" && git push)
