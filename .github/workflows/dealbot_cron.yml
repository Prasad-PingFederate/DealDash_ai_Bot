name: Autonomous DealBot Runner

on:
  schedule:
    # UTC. Each start stays on the runner and posts about once an hour for
    # up to 5h15m, stopping at 23:20 IST. GitHub often never creates a
    # scheduled run. The starts are 3 hours apart, so a dropped tick still
    # leaves the previous runner awake, and the next one covers what remains.
    #   04:07 UTC = 09:37 IST
    #   07:07 UTC = 12:37 IST
    #   10:07 UTC = 15:37 IST
    #   13:07 UTC = 18:37 IST
    #   16:07 UTC = 21:37 IST
    # Minute 7 stays off the crowded :00 slot.
    - cron: '7 4,7,10,13,16 * * *'

  workflow_dispatch:

# Dealbot and the weekly advisor both push main. One at a time, and do not
# cancel a run that has already posted to Telegram.
concurrency:
  group: dealdash-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    # GitHub kills a job at 6 hours. The script stops itself just before that.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the hourly session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'nousresearch/hermes-3-llama-3.1-8b' }}
          SALE_MODE: ${{ secrets.SALE_MODE || '' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
          AGENT_MODE: 'true'
          AGENT_LLM: 'true'
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          LISTEN_FOR_ENGAGEMENT: 'true'
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/actions_session.sh
