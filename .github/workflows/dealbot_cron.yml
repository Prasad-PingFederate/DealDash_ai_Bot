name: Autonomous DealBot Runner

on:
  schedule:
    # GitHub drops most :15/:45 ticks and starts the ones it keeps 1–5 hours late.
    # Minute 7 is off the congested :00/:15/:30/:45 pile. Hours 3–17 UTC are
    # 08:30–23:00 IST. A late runner is stopped by the IST window check below,
    # so a 17:00 UTC job that starts at 01:00 IST does not post overnight.
    - cron: '7 3-17 * * *'

  workflow_dispatch:

# One poster at a time. A delayed run must finish its state push before the next starts.
concurrency:
  group: dealbot-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-dealbot:
    runs-on: ubuntu-latest
    steps:
      - name: Check IST posting window
        id: window
        run: |
          hour=$(TZ=Asia/Kolkata date +%H)
          minute=$(TZ=Asia/Kolkata date +%M)
          now=$((10#$hour * 60 + 10#$minute))
          start=$((8 * 60 + 40))
          end=$((23 * 60 + 20))
          echo "IST now is ${hour}:${minute}"
          if [ "$now" -lt "$start" ] || [ "$now" -gt "$end" ]; then
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Outside 08:40–23:20 IST. Skipping so a late GitHub runner does not post at night."
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.window.outputs.open == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Set up Python
        if: steps.window.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.window.outputs.open == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DealBot Cycle
        if: steps.window.outputs.open == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY || secrets.OPENROUTER_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'nousresearch/hermes-3-llama-3.1-8b' }}
          SALE_MODE: ${{ secrets.SALE_MODE || '' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DRY_RUN: 'false'
          CONTINUOUS: 'false'
          MAX_POSTS_PER_CYCLE: '3'
          FEEDS_ENABLED: 'true'
          MIN_DISCOUNT_PERCENT: '30'
          ALLOWED_RETAILERS: 'Amazon'
          AGENT_MODE: 'true'
          AGENT_LLM: 'true'
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python run_once.py

      - name: Commit and persist state.sqlite3
        if: steps.window.outputs.open == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -f data/state.sqlite3 || true
          git diff --staged --quiet || git commit -m "chore(bot): persist posted deal state [skip ci]"
          git push origin HEAD:main
