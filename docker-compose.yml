version: "3.8"

services:
  dealbot:
    build: .
    container_name: dealdash-ai-daemon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTINUOUS: "true"
      POLL_INTERVAL_SECONDS: "300"
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
